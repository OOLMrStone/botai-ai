name: Build portable local app

on:
  workflow_dispatch:
  push:
    branches: [codex/local-direct-app]

permissions:
  contents: read

jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      LLM_PROVIDER: mock
      LLM_VISION_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-local-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-local-build.txt
      - name: Build without embedded credentials
        run: python scripts/build_local.py
      - name: Verify native startup and browser assets without model calls
        run: python scripts/smoke_local_build.py
      - name: Upload native portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BotAI-Local-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
