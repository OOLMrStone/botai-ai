# Test deployment.
#
# TLS and authentication are handled by the Caddy the team already runs on the
# host (/etc/caddy/Caddyfile), which holds the certificate for
# api.botai-ege.ru. This stack therefore publishes only to loopback: the port
# is unreachable from the internet, and the proxy is the only way in.
services:
  grading-api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: prod          # non-root, no reloader, no dev deps
    image: ege-grading:latest
    container_name: ege-grading-api
    restart: unless-stopped
    env_file: [../.env]
    # 127.0.0.1 is load-bearing. Publishing 8080 without it would put the
    # service on the public interface *past* the password, and Docker writes
    # its own iptables rules, so ufw would not save us.
    ports: ["127.0.0.1:8080:8000"]
    volumes:
      # Reports outlive the container: a test session is the deliverable.
      - /srv/ege/reports:/data/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
