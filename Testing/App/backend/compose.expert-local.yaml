# Separate loopback expert demo. Never combine with other compose files.
name: botai-expert-local
x-service: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: '10m', max-file: '3'}
  security_opt: ['no-new-privileges:true']
services:
  postgres:
    <<: *defaults
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_DB: botai_expert_local
      POSTGRES_USER: botai_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run init-secrets.py}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      OPS_DB_PASSWORD: ${OPS_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/expert-local/init-db.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [data]
    mem_limit: 512m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U botai_migrator -d botai_expert_local']
      interval: 5s
      timeout: 3s
      retries: 20
  garage:
    <<: *defaults
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?}
      GARAGE_DEFAULT_BUCKET: botai
    volumes:
      - ./runtime/expert-local/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks: [data]
    mem_limit: 384m
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 10s
      timeout: 5s
      retries: 10
  mailpit:
    <<: *defaults
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    environment:
      MP_MAX_MESSAGES: '200'
      MP_DATABASE: /data/mailpit.db
    ports: ['127.0.0.1:18026:8025']
    volumes: [mailpit-data:/data]
    networks: [edge, data]
    mem_limit: 128m
  ai:
    <<: *defaults
    build: {context: ./runtime/expert-local/ai-export}
    environment:
      APP_ENV: prod
      LLM_PROVIDER: mock
      LLM_VISION_PROVIDER: mock
      DEBUG_ENABLED: 'false'
      DEBUG_ALLOW_IN_PROD: 'false'
      INTERNAL_GRADING_ENABLED: 'true'
      INTERNAL_GRADING_TOKEN: ${AI_SERVICE_TOKEN:?}
    networks: [grading]
    mem_limit: 512m
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    volumes: [ai-diagnostics:/srv/data/suspicious-submissions]
    cap_drop: [ALL]
  pdf-renderer:
    <<: *defaults
    build: {context: ., dockerfile: renderer/pdf/Dockerfile}
    networks: [pdf]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m,mode=1777']
    cap_drop: [ALL]
  backend:
    <<: *defaults
    build: {context: ., dockerfile: Dockerfile.integration, target: runtime}
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/botai_expert_local
      SPRING_DATASOURCE_USERNAME: botai_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?}
      SPRING_FLYWAY_USER: botai_migrator
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?}
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:13003}
      SESSION_COOKIE_SECURE: 'false'
      SERVER_SERVLET_SESSION_COOKIE_NAME: EXPERT_SESSION
      APP_BILLING_MODE: disabled
      APP_PDF_RENDERER_BASE_URL: http://pdf-renderer:8080
      APP_EXPERT_GRADING_ALLOW_LIVE: 'false'
      APP_STORAGE_ENDPOINT: http://garage:3900
      APP_STORAGE_BUCKET: botai
      APP_STORAGE_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      APP_STORAGE_SECRET_KEY: ${S3_SECRET_KEY:?}
      APP_STORAGE_REGION: garage
      APP_GRADING_BASE_URL: http://ai:8000
      APP_GRADING_TOKEN: ${AI_SERVICE_TOKEN:?}
    ports: ['127.0.0.1:18085:8080']
    networks: [edge, data, grading, pdf]
    depends_on:
      postgres: {condition: service_healthy}
      garage: {condition: service_healthy}
      ai: {condition: service_healthy}
      pdf-renderer: {condition: service_healthy}
    mem_limit: 768m
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
    cap_drop: [ALL]
  frontend:
    <<: *defaults
    profiles: [web]
    build:
      context: ${FRONT_CONTEXT:-../botai-front}
      dockerfile: Dockerfile.integration
      args: {BACKEND_URL: 'http://backend:8080', APP_ENV: dev}
    environment: {BACKEND_URL: 'http://backend:8080'}
    ports: ['127.0.0.1:13003:3000']
    networks: [edge]
    depends_on: {backend: {condition: service_healthy}}
    mem_limit: 512m
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m', '/app/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000']
    cap_drop: [ALL]
  adminer:
    <<: *defaults
    profiles: [ops]
    image: adminer:5.4.1@sha256:a3167350c4eb9ae4473b8ea0f49c8e5ae74c87b240ee2f6086521dba2a6bf243
    environment: {ADMINER_DEFAULT_SERVER: postgres}
    ports: ['127.0.0.1:18091:8080']
    networks: [edge, data]
    mem_limit: 128m
    depends_on: {postgres: {condition: service_healthy}}
networks:
  edge: {}
  data: {internal: true}
  grading: {internal: true}
  pdf: {internal: true}
volumes:
  postgres-data: {}
  garage-meta: {}
  garage-data: {}
  mailpit-data: {}
  ai-diagnostics: {}
