[project]
name = "ege-math-grading-service"
version = "0.1.0"
description = "AI-assisted grading microservice for part 2 of the Russian EGE in advanced mathematics"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "openai>=3.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]
